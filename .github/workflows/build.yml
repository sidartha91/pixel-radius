name: Construire Pixel Radius

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les dossiers Android et Web (org com.aaistudio)
        run: |
          flutter create . --org com.aaistudio --project-name pixel_radius --platforms=android,web
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="com.android.vending.BILLING"/>\n    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n    <application#' "$M"
          sed -i 's#android:label="pixel_radius"#android:label="Pixel Radius"#' "$M"
          rm -f test/widget_test.dart
          # Contournement d'un bug de l'outil lint Android sur in_app_purchase_android
          ROOT=$(ls android/build.gradle.kts android/build.gradle 2>/dev/null | head -1)
          printf '\nsubprojects {\n    tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }\n}\n' >> "$ROOT"
          tail -5 "$ROOT"

      - run: flutter pub get

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: APK Android
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk pixel-radius.apk

      - name: Version web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Publier l'APK (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pixel Radius — build ${{ github.run_number }}
          body: "Android : **pixel-radius.apk** · iOS : **pixel-radius-ios-non-signee.ipa** (à signer avant installation)"
          files: pixel-radius.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-radius-apk
          path: pixel-radius.apk

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  ios:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet iOS (bundle com.aaistudio.pixelRadius)
        run: |
          flutter create . --org com.aaistudio --project-name pixel_radius --platforms=ios
          rm -f test/widget_test.dart
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Pixel Radius" ios/Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Pixel Radius" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Runner/Info.plist || true

      - run: flutter pub get

      - name: Compiler l'app iOS (non signée)
        run: flutter build ios --release --no-codesign

      - name: Empaqueter l'IPA non signée
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry pixel-radius-ios-non-signee.ipa Payload
          ls -lh pixel-radius-ios-non-signee.ipa

      - name: Ajouter l'IPA à la page Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: pixel-radius-ios-non-signee.ipa

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
